profile:
  name: qdii_growth
  display_name: 海外成长型
  version: "1.0.0"
  description: "偏向美股/QDII成长资产，但仍保留卫星仓上限和重叠提示。"

analysis:
  rules: examples/rules.example.yaml
  asset_groups: examples/asset_groups.example.yaml
  portfolio_template: examples/profiles/qdii_growth.portfolio_template.yaml
  overseas_exposure: examples/overseas_exposure.example.yaml

preflight:
  strict_quotes: true
  fail_on_stale_quotes: false
  fail_on_duplicate_codes: false
  max_normal_stale_days: 3
  max_qdii_stale_days: 5

chat_summary:
  style: wechat
  max_signals: 4
  max_warnings: 5

risk_notes:
  - "该模板仅用于结构化检查，不代表投资建议。"
  - "规则驱动，不预测价格。"
